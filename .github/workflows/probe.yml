name: archpower-403-probe

# Is the repo.archlinuxpower.org 403 keyed on the source IP, or on the TLS
# ClientHello / User-Agent / HTTP version? Run the same request shapes from a
# GitHub-hosted runner (Azure egress) and compare with an allowed egress.
#
# Nothing is written to any other repository. workflow_dispatch only.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Runner egress identity
        run: |
          echo "### Runner egress" >> "$GITHUB_STEP_SUMMARY"
          curl -sS --max-time 20 https://ipinfo.io/json | tee /tmp/ipinfo.json || true
          {
            echo '```json'
            cat /tmp/ipinfo.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Client-shape matrix (system curl / UA / HTTP version)
        run: |
          bash probe.sh | tee /tmp/probe-curl.txt
          {
            echo "### System clients"
            echo '```'
            cat /tmp/probe-curl.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Browser TLS clients (curl-impersonate, pinned)
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL -o ci.tar.gz \
            https://github.com/lexiforest/curl-impersonate/releases/download/v2.2.3/curl-impersonate-v2.2.3.x86_64-linux-gnu.tar.gz
          mkdir -p ci && tar xzf ci.tar.gz -C ci
          cd "$GITHUB_WORKSPACE"
          CI_DIR="$RUNNER_TEMP/ci" bash probe.sh | tee /tmp/probe-impersonate.txt
          {
            echo "### Browser TLS (curl-impersonate v2.2.3)"
            echo '```'
            cat /tmp/probe-impersonate.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: workerd (the rv worker, verbatim, on this egress)
        run: |
          set -e
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund workerd@1.20261013.1
          ./node_modules/.bin/workerd serve config.capnp >/tmp/workerd.log 2>&1 &
          WK=$!
          sleep 5
          for p in /base/powerpc/base.db /; do
            out="$(curl -sS -o /tmp/wk.body -D /tmp/wk.hdr -w '%{http_code}|%{http_version}' \
              --max-time 60 "http://127.0.0.1:8787/https://repo.archlinuxpower.org${p}" || echo 'ERR|-')"
            ray="$(awk 'tolower($1)=="cf-ray:"{print $2}' /tmp/wk.hdr | tr -d '\r')"
            echo "WORKERD path=${p} status=${out%%|*} http=${out#*|} cf-ray=${ray:-none} body=$(head -c 90 /tmp/wk.body | tr '\n\r' '  ')"
          done | tee /tmp/probe-workerd.txt
          kill "$WK" 2>/dev/null || true
          {
            echo "### workerd (rv worker verbatim, Cloudflare Workers TLS stack)"
            echo '```'
            cat /tmp/probe-workerd.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Raw TCP over relay (same bytes, different egress)
        run: |
          set -e
          TOKEN="$(curl -sS -X POST https://tcp.ssh.relay.ajam.dev/v1/mint \
            -H 'content-type: application/json' -d '{}' | jq -r .token)"
          for relay in tcp.ssh.relay.ajam.dev tcp-azure-westus2.ssh.relay.ajam.dev; do
            for prof in node chrome; do
              RELAY_TOKEN="$TOKEN" node relay_probe.mjs "$relay" repo.archlinuxpower.org 443 vpc "$prof" || true
            done
          done | tee /tmp/probe-relay.txt
          {
            echo "### Relay (Cloudflare Gateway egress) + Node TLS shapes"
            echo '```'
            cat /tmp/probe-relay.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verdict
        run: |
          echo "Compare the runner (Azure) statuses against the relay (Cloudflare)"
          echo "and the local control. Identical statuses across every client shape"
          echo "from one egress mean the discriminator is the source IP, not TLS."
          { echo "### All results"
            echo '```'
            cat /tmp/probe-curl.txt /tmp/probe-impersonate.txt /tmp/probe-workerd.txt /tmp/probe-relay.txt 2>/dev/null
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
