name: archpower-403-repeat

# The isolation run hinted the challenge is a risk score over the *combination*
# of TLS shape and headers. Repeat every cell several times so the claim is not
# a single sample, and compare the two proxies named in the report.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Runner egress identity
        run: |
          curl -sS --max-time 20 https://ipinfo.io/json | tee /tmp/ipinfo.json || true
          { echo "### Egress"; echo '```json'; cat /tmp/ipinfo.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Repeated curl cells (5x each)
        run: |
          set -u
          T='https://repo.archlinuxpower.org/base/powerpc/base.db'
          H=(
            -H 'sec-ch-ua: "Chromium";v="136", "Google Chrome";v="136", "Not.A/Brand";v="99"'
            -H 'sec-ch-ua-mobile: ?0' -H 'sec-ch-ua-platform: "macOS"' -H 'Upgrade-Insecure-Requests: 1'
            -H 'User-Agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.7'
            -H 'Sec-Fetch-Site: none' -H 'Sec-Fetch-Mode: navigate' -H 'Sec-Fetch-User: ?1' -H 'Sec-Fetch-Dest: document'
            -H 'Accept-Encoding: gzip, deflate, br, zstd' -H 'Accept-Language: en-US,en;q=0.9' -H 'Priority: u=0, i'
          )
          C='ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA:AES256-SHA'
          T13='TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256'
          run() {
            local label="$1"; shift
            local out=""
            for i in 1 2 3 4 5; do
              local c
              c="$(curl -sS --max-time 60 -o /dev/null -w '%{http_code}' "$T" "$@" 2>/dev/null || echo E)"
              out="$out $c"
            done
            printf '%-34s 5x:%s\n' "$label" "$out"
          }
          {
            echo "### Repeated curl cells"
            run "plain"
            run "chrome-headers" "${H[@]}"
            run "browser-ciphers" --ciphers "$C" --tls13-ciphers "$T13" --curves 'X25519:P-256:P-384'
            run "browser-ciphers+chrome-headers" "${H[@]}" --ciphers "$C" --tls13-ciphers "$T13" --curves 'X25519:P-256:P-384'
            run "chrome-ua-only" -A 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/155.0.0.0 Safari/537.36'
          } | tee /tmp/rep-curl.txt
          cat /tmp/rep-curl.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Repeated browser TLS (curl-impersonate, 3x)
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL -o ci.tar.gz https://github.com/lexiforest/curl-impersonate/releases/download/v2.2.3/curl-impersonate-v2.2.3.x86_64-linux-gnu.tar.gz
          mkdir -p ci && tar xzf ci.tar.gz -C ci
          T='https://repo.archlinuxpower.org/base/powerpc/base.db'
          {
            echo "### Repeated browser TLS"
            for b in curl_chrome136 curl_firefox135 curl_safari172_ios; do
              out=""
              for i in 1 2 3; do
                c="$("$RUNNER_TEMP/ci/$b" -s -o /dev/null -w '%{http_code}' --max-time 60 "$T" 2>/dev/null || echo E)"
                out="$out $c"
              done
              printf '%-34s 3x:%s\n' "$b" "$out"
            done
            out=""
            for i in 1 2 3; do
              c="$("$RUNNER_TEMP/ci/curl_chrome136" -s -o /dev/null -w '%{http_code}' --http1.1 --max-time 60 "$T" 2>/dev/null || echo E)"
              out="$out $c"
            done
            printf '%-34s 3x:%s\n' "chrome136-http1.1" "$out"
          } | tee /tmp/rep-imp.txt
          cat /tmp/rep-imp.txt >> "$GITHUB_STEP_SUMMARY"

      - name: workerd (rv worker, 3x)
        run: |
          set -e
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund workerd@1.20261013.1
          ./node_modules/.bin/workerd serve config.capnp >/tmp/workerd.log 2>&1 &
          WK=$!; sleep 5
          out=""
          for i in 1 2 3; do
            c="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 'http://127.0.0.1:8787/https://repo.archlinuxpower.org/base/powerpc/base.db' || echo E)"
            out="$out $c"
          done
          echo "workerd (rv worker verbatim)     3x:$out" | tee /tmp/rep-workerd.txt
          kill "$WK" 2>/dev/null || true
          cat /tmp/rep-workerd.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Proxies named in the report (rv and r.jina.ai), 3x
        run: |
          set -u
          P='https://repo.archlinuxpower.org/base/powerpc/base.db'
          R='https://repo.archlinuxpower.org/'
          probe() {
            local label="$1" url="$2" out="" extra=()
            for i in 1 2 3; do
              local c
              c="$(curl -sS --max-time 90 -o /dev/null -w '%{http_code}' "$url" 2>/dev/null || echo E)"
              out="$out $c"
            done
            printf '%-34s 3x:%s\n' "$label" "$out"
          }
          {
            echo "### Proxy comparison"
            probe "direct-db" "$P"
            probe "rv-proxy-db" "https://api.rv.pkgforge.dev/$P"
            probe "rv-proxy-root" "https://api.rv.pkgforge.dev/$R"
            probe "jina-db" "https://r.jina.ai/$P"
            probe "jina-root" "https://r.jina.ai/$R"
          } | tee /tmp/rep-proxy.txt
          cat /tmp/rep-proxy.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Relay egress contrast (Cloudflare)
        run: |
          set -e
          TOKEN="$(curl -sS -X POST https://tcp.ssh.relay.ajam.dev/v1/mint -H 'content-type: application/json' -d '{}' | jq -r .token)"
          for prof in node chrome; do
            RELAY_TOKEN="$TOKEN" node relay_probe.mjs tcp.ssh.relay.ajam.dev repo.archlinuxpower.org 443 vpc "$prof" || true
          done | tee /tmp/rep-relay.txt
          cat /tmp/rep-relay.txt >> "$GITHUB_STEP_SUMMARY"
