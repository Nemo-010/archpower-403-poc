name: mirror-sync
# SPDX-License-Identifier: 0BSD
#
# Publish one ArchPOWER repository/architecture as an OCI artifact.
#
# Weekly and manual. A run over a repository larger than a runner's disk is
# sliced: set max_files and run it more than once. The Actions cache carries the
# files a run has already verified, and the databases are always refetched.
on:
  workflow_dispatch:
    inputs:
      repo:
        description: repository name
        default: base
      arch:
        description: powerpc | powerpc64 | powerpc64le
        default: powerpc
      max_files:
        description: stop after N packages (0 = the whole closure)
        default: "0"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      NS: ${{ github.repository_owner }}
      REPO: ${{ inputs.repo || 'base' }}
      ARCH: ${{ inputs.arch || 'powerpc' }}
      MAX_FILES: ${{ inputs.max_files || '0' }}
      SKIP_FETCH: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/cache@v4
        with:
          path: stage
          key: mirror-${{ github.repository_owner }}-${{ inputs.repo || 'base' }}-${{ inputs.arch || 'powerpc' }}
          restore-keys: |
            mirror-${{ github.repository_owner }}-${{ inputs.repo || 'base' }}-

      - name: Install the Chromium client
        run: |
          npm i --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium

      - uses: oras-project/setup-oras@v1

      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sync
        run: |
          export NS="$(echo "$NS" | tr 'A-Z' 'a-z')"
          bash mirror/sync.sh "$REPO" "$ARCH"
          echo "NS=$NS" >> "$GITHUB_ENV"

      - name: Set the package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The client pulls anonymously, so the package has to be public. This
          # is a one-time package setting; report rather than fail when the
          # workflow token cannot change it.
          gh api --method PATCH "/user/packages/container/archpower-$REPO" \
            -f visibility=public && echo "visibility: public" \
            || echo "visibility: needs the one-time package setting"

      - name: Verify from a cold pull
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REF="ghcr.io/$NS/archpower-$REPO:$ARCH"
          mkdir -p /tmp/pull && cd /tmp/pull
          oras pull "$REF"
          echo "--- pulled: $(ls -1 | wc -l) files ---"
          ls -la base.db base.db.sig index.tsv
          gpg --batch --import "$GITHUB_WORKSPACE/mirror/keys/archpower.gpg" 2>/dev/null
          gpg --batch --verify base.db.sig base.db && echo "database signature: GOOD"
          echo "index rows: $(($(wc -l < index.tsv) - 1))"

          echo "--- client, with a token ---"
          cd "$GITHUB_WORKSPACE"
          url="https://repo.archlinuxpower.org/$REPO/$ARCH/base.db"
          GHCR_NS="$NS" GHCR_ARCH="$ARCH" GHCR_TOKEN="$TOKEN" GHCR_USER="${{ github.actor }}" \
            sh mirror/ghcr-fetch "$url" /tmp/client.db
          cmp /tmp/client.db /tmp/pull/base.db && echo "client byte-identical"
          sha256sum /tmp/client.db | cut -c1-24

          echo "--- client, anonymously ---"
          if GHCR_NS="$NS" GHCR_ARCH="$ARCH" sh mirror/ghcr-fetch "$url" /tmp/client-anon.db 2>/tmp/anon.err; then
            cmp /tmp/client-anon.db /tmp/pull/base.db && echo "anonymous pull byte-identical"
          else
            echo "anonymous pull unavailable: $(cat /tmp/anon.err)"
          fi
