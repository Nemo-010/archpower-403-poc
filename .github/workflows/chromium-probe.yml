name: chromium-probe
# Proves tier 2: a real Chromium fetches the ArchPOWER database from a runner
# that plain curl cannot. Manual only.
on:
  workflow_dispatch:
    inputs:
      arch:
        description: powerpc | powerpc64 | powerpc64le
        default: powerpc

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Who are we from here
        run: curl -sSL --max-time 30 https://ipinfo.io/json | tee /tmp/egress.json

      - name: Install Playwright Chromium
        run: |
          npm i --no-audit --no-fund playwright@latest
          npx playwright install --with-deps chromium-headless-shell

      - name: Plain curl (the control that fails)
        run: |
          code=$(curl -sS -o /tmp/plain.bin -w '%{http_code}' --connect-timeout 10 --max-time 60 \
            "https://repo.archlinuxpower.org/base/${{ inputs.arch }}/base.db" || true)
          echo "plain curl status: $code, bytes: $(wc -c < /tmp/plain.bin)"
          grep -qi 'just a moment\|cf-mitigated' /tmp/plain.bin && echo "plain curl got the challenge"

      - name: Real Chromium fetch
        run: |
          time node chromium_fetch.mjs \
            "https://repo.archlinuxpower.org/base/${{ inputs.arch }}/base.db" /tmp/db.chromium
          ls -la /tmp/db.chromium
          echo "sha256: $(sha256sum /tmp/db.chromium | cut -d' ' -f1)"
          head -c 4 /tmp/db.chromium | od -An -tx1

      - name: Is it a readable database
        run: |
          file /tmp/db.chromium
          tar --zstd -tf /tmp/db.chromium 2>/dev/null | head -3
          echo "entries: $(tar --zstd -tf /tmp/db.chromium 2>/dev/null | wc -l)"
